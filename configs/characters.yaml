# Karakter preset'leri.
# Kontrol MODEL SEVİYESİNDE yapılır; DSP pitch shift YOK.
#
# Alanlar:
#   speaker_id    : JVS konuşmacısı (jvs001..jvs100) — modelde (spk2id) olmalı
#   style_id      : Neutral | normal | whisper | falsetto   (jvs_multi12 style2id)
#   style_weight  : stil vektörü ağırlığı (0.0 - 1.0+; whisper/falsetto için 1.0)
#   length_scale  : konuşma hızı (>1 yavaş, <1 hızlı)
#   sdp_ratio     : tonlama çeşitliliği (0.0 - 1.0)
#   noise         : örnekleme gürültüsü / ifade (0.0 - 1.0)
#   description   : serbest açıklama (koda etkisi yok)
#
# Konuşmacı seçimi JVS kayıtlarından ölçülen medyan F0 / konuşma hızına dayanır
# (JVS kayıtlarından ölçülen medyan F0 / konuşma hızı):
#   jvs006 M  96Hz (en pes)        jvs071 M 107Hz (en yavaş, 4.7 kr/sn)
#   jvs028 M 116Hz                 jvs042 M 137Hz (en hızlı erkek, 6.4 kr/sn)
#   jvs003 M 160Hz                 jvs001 M 164Hz (yüksek F0 varyansı = ifadeli)
#   jvs064 F 227Hz (en sakin)      jvs017 F 233Hz     jvs025 F 236Hz
#   jvs084 F 243Hz                 jvs002 F 244Hz (en hızlı kadın, 6.5 kr/sn)
#   jvs036 F 282Hz (en tiz, en geniş F0 = en ifadeli)
#
# jvs_multi12 modeli konuşmacıları: jvs001 jvs002 jvs003 jvs006 jvs017 jvs025
#                                  jvs028 jvs036 jvs042 jvs064 jvs071 jvs084

# --- MVP 4: jvs_multi12 karakterleri (v2'de de çalışır; dinleme testinde JVNV'den belirgin kötü,
#     web sitesinde kullanılmıyor — bkz. web/dialog.json 'characters') ---
